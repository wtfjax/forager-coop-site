<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forager Co-op — Mapa</title>
<style>
  :root {
    --bg: #14121a; --panel: #1e1b27; --panel2: #262233; --line: #34304a;
    --text: #ece8f4; --muted: #a49cb8; --accent: #f2c94c; --accent2: #7ad3a8;
    --fixed: #3fb97f; --mod: #4a9ff5; --unknown: #8a83a0;
    --grama: #6cc24a; --deserto: #e8a33d; --cemiterio: #9b7fd1; --inverno: #6ec6e8; --fogo: #e8603d;
    --head: 54px; --drawer: min(420px, 38vw);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  header { height: var(--head); display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; white-space: nowrap; }
  h1 span { color: var(--accent); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  header .sp { flex: 1; }
  header button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  header button:hover { border-color: var(--accent); }
  main { height: calc(100% - var(--head)); margin-right: var(--drawer); display: flex; padding: 10px; align-items: center; justify-content: center; }
  .mapwrap { flex: 0 0 auto; display: grid; place-items: center; }
  /* The 7x7 map, as big as fits the window without scrolling (the items panel takes at least 320 px beside it). */
  .map, .skilltree { width: min(calc(100vw - var(--drawer) - 20px), calc(100vh - var(--head) - 20px)); aspect-ratio: 1;
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, 1fr); gap: 5px; }
  .tile { border-radius: 9px; overflow: hidden; position: relative; cursor: pointer; border: 2px solid var(--bc);
    background: #0e0c14 center/cover no-repeat; image-rendering: pixelated; transition: transform .1s; }
  .tile:hover { transform: scale(1.04); z-index: 2; outline: 2px solid var(--accent); }
  .tile .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 5px 3px; font-size: clamp(8px, 1.15vmin, 12px);
    line-height: 1.2; background: linear-gradient(transparent, rgba(8,6,14,.94) 30%); }
  .tile .lbl small { color: var(--muted); font-size: .85em; }
  .tile .pn { position: absolute; top: 3px; right: 3px; background: var(--accent); color: #1a1500; font-weight: 700;
    font-size: clamp(8px, 1.1vmin, 12px); border-radius: 5px; padding: 0 5px; }
  .tile .st { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; box-shadow: 0 0 0 1.5px #0008; }
  /* My check on an island (area confirmed synced): faint on hover, solid green when set. */
  .tile .ck { position: absolute; top: 3px; left: 3px; width: clamp(16px, 2.4vmin, 24px); height: clamp(16px, 2.4vmin, 24px); border-radius: 50%; border: 2px solid #fff8;
    background: #0009; color: transparent; font: 900 clamp(10px, 1.6vmin, 15px)/1 system-ui; display: grid; place-items: center; padding: 0; cursor: pointer; opacity: 0; transition: opacity .1s; }
  .tile:hover .ck { opacity: .85; color: #fff8; }
  .tile .ck.on { opacity: 1; background: #2fbf5b; border-color: #fff; color: #fff; box-shadow: 0 0 0 2px #0008; }
  .tile.done { box-shadow: inset 0 0 0 3px #2fbf5b; }
  .tile .lbl .mine { color: #ffe08a; }
  .notes { display: flex; flex-direction: column; gap: 8px; }
  .notes input[type=text], .notes textarea { background: #0e0c14; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; width: 100%; box-sizing: border-box; }
  .notes textarea { min-height: 90px; resize: vertical; }
  .notes label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .notes .saved { color: var(--muted); font-size: 12px; }
  .views { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .views button { border: none; background: none; padding: 4px 14px; border-radius: 999px; }
  .views button.on { background: var(--accent); color: #1a1500; font-weight: 600; }
  .langs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-right: 8px; }
  .langs button { border: none; background: none; padding: 3px 9px; border-radius: 999px; font-weight: 600; font-size: 12px; }
  .langs button.on { background: var(--accent); color: #1a1500; }
  /* The skill tree: 8x8 like the game's, four 4x4 branches meeting in the middle. */
  .skilltree { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 6px; position: relative; }
  .skill { position: relative; cursor: pointer; background: center/contain no-repeat; image-rendering: pixelated; transition: transform .1s; }
  .skill img { position: absolute; inset: 10%; width: 80%; height: 80%; image-rendering: pixelated; }
  .skill:hover { transform: scale(1.08); z-index: 2; filter: drop-shadow(0 0 6px var(--accent)); }
  .skill .sid { position: absolute; right: -2px; bottom: -4px; background: #0e0c14; color: var(--muted); font: 600 clamp(8px, 1vmin, 11px) ui-monospace, Menlo, monospace; border-radius: 4px; padding: 0 3px; }
  .skill .snm { position: absolute; left: 50%; bottom: -2px; transform: translate(-50%, 100%); white-space: nowrap; font-size: clamp(8px, 1.05vmin, 11px); color: var(--muted); pointer-events: none; }
  .skilltree .blabel { position: absolute; font: 700 clamp(10px, 1.6vmin, 15px) system-ui; letter-spacing: 1px; text-transform: uppercase; opacity: .9; pointer-events: none; }
  /* Feats: the game's feat tiles (64 px, orange = earned, grey = locked) on its blue pattern, with its progress bar. */
  .feats { position: absolute; inset: var(--head) var(--drawer) 0 0; overflow: auto; padding: 18px 22px 40px;
    background: #10162b url('feats/bg0.png') repeat; background-size: 64px; image-rendering: pixelated; }
  .fhead { max-width: 1100px; margin: 0 auto 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .fhead h2 { margin: 0; font: 800 26px system-ui; letter-spacing: 2px; text-transform: uppercase; color: #fff; text-shadow: 0 3px 0 #0008; }
  .fbar { width: min(720px, 100%); height: 30px; background: url('feats/bar0.png') center/100% 100% no-repeat; image-rendering: pixelated; position: relative; }
  .fbar i { position: absolute; left: 0; top: 0; bottom: 0; background: url('feats/bar1.png') left center/720px 100% no-repeat; }
  .fbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 13px system-ui; color: #fff; text-shadow: 0 2px 0 #000; }
  .ftools { display: flex; gap: 8px; align-items: center; }
  .ftools input { background: #0e0c14cc; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 240px; }
  .ftools button { background: #0e0c14cc; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .fgrid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .feat { background: #0d1124d9; border: 2px solid #2a3560; border-radius: 10px; padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .feat img { width: 64px; height: 64px; image-rendering: pixelated; }
  .feat b { font-size: 13px; text-transform: lowercase; }
  .feat small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .feat .fid { font: 600 10px ui-monospace, Menlo, monospace; color: var(--accent2); }
  /* Gear and skins tabs: cards with the item/skin picture, what it does and how to get it. */
  .gsec { max-width: 1100px; margin: 0 auto 26px; }
  .gsec h3 { margin: 0 0 4px; font: 800 18px system-ui; letter-spacing: 1px; text-transform: uppercase; color: #fff; text-shadow: 0 2px 0 #0008; }
  .gsec > p { margin: 0 0 10px; color: #c9c2dd; font-size: 13px; }
  .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .gcard { background: #0d1124d9; border: 2px solid #2a3560; border-radius: 10px; padding: 10px; display: flex; gap: 10px; align-items: flex-start; }
  .gcard .gi { flex: 0 0 56px; height: 56px; display: grid; place-items: center; background: #ffffff0d; border-radius: 8px; }
  .gcard .gi img { zoom: 2; image-rendering: pixelated; }
  .gcard .gt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gcard b { font-size: 14px; } .gcard small { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .gcard .how { font-size: 12.5px; line-height: 1.35; color: #e8e3f5; }
  .gcard .how::before { content: "Como conseguir: "; color: var(--accent2); font-weight: 700; }
  .gtag { align-self: flex-start; font: 700 10px system-ui; text-transform: uppercase; letter-spacing: .5px; padding: 2px 7px; border-radius: 999px; background: #2a3560; color: #fff; }
  .gtag.t-baú, .gtag.t-item { background: #a0612d; } .gtag.t-missão { background: #7a3d8f; } .gtag.t-fabricado { background: #2f7a55; }
  .gtag.t-cortado, .gtag.t-\? { background: #5a5a66; } .gtag.t-façanha { background: #b0802a; } .gtag.t-terraria { background: #3c7a2a; }
  .gtag.t-padrão { background: #3d5a99; } .gtag.t-museu { background: #8f5a3d; }
  .tiers { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .tier { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
  .tier img { zoom: 2; image-rendering: pixelated; }
  .tier .ti { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 36px; }
  .tier .tt { flex: 1; min-width: 0; } .tier .tt small { display: block; }
  .tier .costs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .skgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .skin { background: #0d1124d9; border: 2px solid #2a3560; border-radius: 10px; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .skin .si { height: 104px; display: grid; place-items: end center; }
  .skin .si img { zoom: 3; image-rendering: pixelated; }
  .skin b { font-size: 13px; } .skin small { color: #d9d3ea; font-size: 11.5px; line-height: 1.3; }
  .skin .gtag { align-self: center; }
  /* Equipment screen: the game's gear boxes (sprites are already drawn at 2x, so shown at native size). */
  #gear { background: #1d1a2e; }
  .eq { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .eqrow { display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .eqp { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ftx { font-family: "Press Start 2P", monospace; line-height: 1.35; white-space: nowrap;
    text-shadow: 2px 0 #17111a, -2px 0 #17111a, 0 2px #17111a, 0 -2px #17111a, 2px 2px #17111a, -2px 2px #17111a, 2px -2px #17111a, -2px -2px #17111a, 0 4px #17111a; }
  .eq .ft { display: inline-flex; align-items: center; flex-wrap: nowrap; line-height: 0; }
  .eq .ft i { display: inline-block; image-rendering: pixelated; flex: 0 0 auto; }
  .eqt .ft, .eqdet .ft { filter: drop-shadow(0 2px 0 #17111a); }
  .eqbox { display: grid; gap: 6px; padding: 10px 10px 14px; border: 10px solid transparent; border-image-slice: 10 fill; border-image-width: 10px; image-rendering: pixelated; }
  .b0.eqbox, .b0.eqdet { border-image-source: url(gear/s1228_0.png); } .b1.eqbox, .b1.eqdet { border-image-source: url(gear/s1228_1.png); }
  .b2.eqbox, .b2.eqdet { border-image-source: url(gear/s1228_2.png); } .b3.eqbox, .b3.eqdet { border-image-source: url(gear/s1228_3.png); }
  .b4.eqbox, .b4.eqdet { border-image-source: url(gear/s1228_4.png); }
  .eqs { width: 48px; height: 48px; padding: 0 0 4px; margin: 0; border: 0; outline: none; -webkit-appearance: none; appearance: none; cursor: pointer; position: relative;
    display: grid; place-items: center; background: url(gear/s1229_0.png) 0 0/48px 48px no-repeat; image-rendering: pixelated; -webkit-tap-highlight-color: transparent; }
  .eqs.b1 { background-image: url(gear/s1229_1.png); } .eqs.b2 { background-image: url(gear/s1229_2.png); }
  .eqs.b3 { background-image: url(gear/s1229_3.png); } .eqs.b4 { background-image: url(gear/s1229_4.png); }
  .eqs img { zoom: 2; image-rendering: pixelated; max-width: 18px; max-height: 18px; object-fit: contain; }
  .eqs:hover { filter: brightness(1.2); }
  .eqs.sel::after { content: ""; position: absolute; left: -8px; top: -8px; width: 64px; height: 64px; pointer-events: none;
    background: url(gear/s1245_0.png) center/64px 64px no-repeat; image-rendering: pixelated; animation: eqpulse .8s ease-in-out infinite alternate; }
  @keyframes eqpulse { to { transform: scale(.9); } }
  .eqs.big { cursor: default; flex: 0 0 48px; } .eqs.big:hover { filter: none; }
  .eqdet { width: min(760px, 100%); box-sizing: border-box; border: 10px solid transparent; border-image-slice: 10 fill; border-image-width: 10px; image-rendering: pixelated;
    padding: 8px 10px 16px; color: #fff; display: flex; flex-direction: column; gap: 10px; text-shadow: 0 1px 0 #17111a; }
  .eqdh { display: flex; gap: 12px; align-items: flex-start; }
  .eqdet .gt { display: flex; flex-direction: column; gap: 5px; }
  .eqdet small, .eqdet .how, .eqdet .tier small { color: #fff; font-size: 13px; line-height: 1.4; }
  .eqdet .how .howl { font-weight: 700; color: #fff2a8; }
  .eqdet .fid { color: #fff2a8; }
  .eqdet .tiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px 14px; }
  .eqdet .tier .ti { background: #0003; border-radius: 6px; }
  .eqnote { color: #c9c2dd; font-size: 12.5px; margin: 0; text-align: center; }
  /* Crafting: the 14 crafting structures; a click opens their inside, drawn with the game's menu sprites. */
  .craft { background: #1b1830; }
  .sgrid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .station { border: 12px solid transparent; border-width: 12px 12px 16px; border-image: url('craft/sprTextBox0.png') 6 6 8 6 fill / 12px 12px 16px 12px stretch; image-rendering: pixelated;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 4px 2px; cursor: pointer; text-align: center; color: #1a1428; transition: transform .1s; }
  .station:hover { transform: translateY(-3px); }
  .station .simg { height: 96px; display: grid; place-items: end center; }
  .station .simg img { image-rendering: pixelated; max-height: 96px; max-width: 120px; transform: scale(2); transform-origin: bottom center; }
  .station b { font-size: 14px; } .station small { font-size: 11px; color: #3b3352; }
  .inside { width: min(820px, 100%) !important; background: #1d1830; padding: 12px; }
  .ihead { border: 10px solid transparent; border-image: url('craft/sprMenuTabWindow0.png') 10 fill / 10px stretch; image-rendering: pixelated;
    display: flex; align-items: center; gap: 14px; padding: 4px 8px; color: #1a1428; }
  .ihead img { image-rendering: pixelated; height: 64px; }
  .ihead h3 { margin: 0; font-size: 22px; text-transform: lowercase; } .ihead small { color: #3b3352; }
  .recipes { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
  .recipe { border: 12px solid transparent; border-image: url('craft/sprTextBox0.png') 16 fill / 12px stretch; image-rendering: pixelated;
    color: #1a1428; padding: 0 2px; display: flex; flex-direction: column; gap: 6px; }
  .recipe.skill { border-image-source: url('craft/sprTextBox1.png'); } .recipe.special { border-image-source: url('craft/sprTextBox2.png'); }
  .rrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .slot { width: 40px; height: 40px; flex: 0 0 40px; background: url('craft/sprInventorySlot0.png') center/100% 100%; image-rendering: pixelated; display: grid; place-items: center; }
  .slot img { image-rendering: pixelated; transform: scale(1.6); }
  .rname { font-weight: 700; min-width: 150px; text-transform: lowercase; }
  .costs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cost { display: flex; align-items: center; gap: 3px; background: #0001; border-radius: 6px; padding: 1px 6px 1px 2px; font: 600 12px ui-monospace, Menlo, monospace; }
  .cost img { image-rendering: pixelated; width: 22px; height: 22px; object-fit: contain; }
  .ulock { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .ulock img { width: 26px; height: 26px; image-rendering: pixelated; }
  .chain { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; padding: 4px 0 2px; }
  .step { background: #ffffff55; border-radius: 8px; padding: 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 96px; max-width: 132px; text-align: center; font-size: 11px; }
  .step img.it { image-rendering: pixelated; width: 30px; height: 30px; object-fit: contain; }
  .step .costs { justify-content: center; gap: 4px; } .step .cost { font-size: 10px; } .step .cost img { width: 16px; height: 16px; }
  .arrow { align-self: center; font-weight: 800; color: #3b3352; }
  .t-Grama { --bc: var(--grama); } .t-Deserto { --bc: var(--deserto); } .t-Cemitério { --bc: var(--cemiterio); }
  .t-Inverno { --bc: var(--inverno); } .t-Fogo { --bc: var(--fogo); }
  .modal { position: fixed; inset: 0; background: rgba(5,4,10,.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.on { display: flex; }
  .sheet { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(720px, 100%); max-height: 92vh; overflow: auto; }
  .sheet .big { height: 260px; background: #0e0c14 center/contain no-repeat; image-rendering: pixelated; }
  .sheet .content { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
  .sheet h3 { margin: 0; font-size: 20px; }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; }
  .row b { color: var(--muted); font-weight: 600; font-size: 13px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; border-radius: 6px; padding: 1px 7px; border: 1px solid currentColor; }
  .b-Grama { color: var(--grama); } .b-Deserto { color: var(--deserto); } .b-Cemitério { color: var(--cemiterio); }
  .b-Inverno { color: var(--inverno); } .b-Fogo { color: var(--fogo); }
  .s-fixed { color: var(--fixed); } .s-mod { color: var(--mod); } .s-unknown { color: var(--unknown); }
  .muted { color: var(--muted); font-size: 13px; }
  .cmd { display: flex; align-items: center; gap: 8px; background: #0e0c14; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 13px ui-monospace, Menlo, monospace; }
  .cmd code { flex: 1; color: var(--accent2); }
  .cmd button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
  .cmd.off code { color: var(--unknown); text-decoration: line-through; }
  .close { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  a { color: var(--accent2); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent2); color: #08241a; padding: 6px 14px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; z-index: 20; }
  .toast.on { opacity: 1; }
  /* Items drawer on the right, closed by default: icon > name > id, one under the other; a click copies /give <id>. */
  .items { position: fixed; top: var(--head); right: 0; bottom: 0; width: var(--drawer); z-index: 6; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); }
  .items .ih { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .items .ih h2 { margin: 0; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
  .items .ih h2 span { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .items input { background: #0e0c14; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cats button { background: #0e0c14; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font: 12px system-ui; cursor: pointer; }
  .cats button.on { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
  .ilist { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: var(--panel2); border-color: var(--line); }
  .item .ic { width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center; }
  .item .ic img { image-rendering: pixelated; zoom: 2; }
  .item .nm { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
  .item .nm small { display: block; color: var(--muted); font-size: 11px; }
  .item .id { font: 600 12px ui-monospace, Menlo, monospace; color: var(--accent2); background: #0e0c14; border-radius: 6px; padding: 1px 7px; }
  .dtabs { display: flex; gap: 4px; }
  .dtabs button { flex: 1; background: #0e0c14; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 5px; font: 600 12px system-ui; cursor: pointer; }
  .dtabs button.on { color: #1a1500; background: var(--accent); border-color: var(--accent); }
  .item.obj { align-items: flex-start; }
  .item.obj .ic img { zoom: 1; max-width: 36px; max-height: 36px; }
  .item .nm code { font: 11px ui-monospace, Menlo, monospace; color: var(--accent2); }
  .item .nm .ds { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; white-space: normal; }
  .safe { font: 600 10px system-ui; border-radius: 6px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
  .safe.ok { color: var(--fixed); } .safe.care { color: var(--accent); } .safe.no { color: var(--fogo); }
  @media (max-width: 700px) { .legend { display: none; } .row { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
</head>
<body>
<header>
  <h1>Forager <span>Co-op</span></h1>
  <div class="legend">
    <span><i style="background:var(--fixed)"></i><t data-i18n="legendFixed"></t></span>
    <span><i style="background:var(--mod)"></i><t data-i18n="legendMod"></t></span>
    <span><i style="background:var(--unknown)"></i><t data-i18n="legendUnknown"></t></span>
  </div>
  <div class="views"><button id="vIslands" class="on" onclick="setView('islands')" data-i18n="vIslands"></button><button id="vSkills" onclick="setView('skills')" data-i18n="vSkills"></button><button id="vFeats" onclick="setView('feats')" data-i18n="vFeats"></button><button id="vCraft" onclick="setView('craft')" data-i18n="vCraft"></button><button id="vGear" onclick="setView('gear')" data-i18n="vGear"></button><button id="vSkins" onclick="setView('skins')" data-i18n="vSkins"></button></div>
  <div class="sp"></div>
  <div class="langs" title="Idioma / Language / Язык"><button data-l="pt" onclick="setLang('pt')">PT</button><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ru" onclick="setLang('ru')">RU</button></div>
  <button onclick="openCommands()" data-i18n="commands"></button>
</header>

<main>
  <div class="mapwrap"><div class="map" id="map"></div><div class="skilltree" id="skilltree" style="display:none"></div></div>
  <section class="feats" id="feats" style="display:none"></section>
  <section class="feats craft" id="craft" style="display:none"></section>
  <section class="feats craft" id="gear" style="display:none"></section>
  <section class="feats" id="skins" style="display:none"></section>
  <aside class="items" id="items">
    <div class="ih">
      <div class="dtabs"><button id="tabGive" class="on" onclick="setDrawer('give')" data-i18n="tabGive"></button><button id="tabSpawn" onclick="setDrawer('spawn')" data-i18n="tabSpawn"></button></div>
      <h2 id="dtitle">Itens / IDs <span id="icount"></span></h2>
      <input id="isearch" placeholder="Buscar por nome ou ID... (clique copia /give)">
      <div class="cats" id="cats"></div>
    </div>
    <div class="ilist" id="ilist"></div>
  </aside>
</main>


<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="data-en.js"></script>
<script src="data-ru.js"></script>
<script src="i18n.js"></script>
<script src="craft.js"></script>
<script>
const D = window.FORAGER;
document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
document.querySelectorAll(".langs button").forEach((b) => b.classList.toggle("on", b.dataset.l === LANG));
$init();
function $init() { const d = document.getElementById("dtitle"); if (d) d.firstChild.textContent = t("titleGive"); const i = document.getElementById("isearch"); if (i) i.placeholder = t("searchGive"); }
const BIOMES = ["Grama", "Deserto", "Cemitério", "Inverno", "Fogo"];
const STATUS = { fixed: t("legendFixed"), mod: t("legendMod"), unknown: t("legendUnknown") };
const STATUS_COLOR = { fixed: "var(--fixed)", mod: "var(--mod)", unknown: "var(--unknown)" };
const WIKI_BIOME = { Grama: "Grass_Biome", Deserto: "Desert_Biome", "Cemitério": "Graveyard_Biome", Inverno: "Winter_Biome", Fogo: "Fire_Biome" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function copy(text) {
  navigator.clipboard.writeText(text).catch(() => {});
  const el = $("#toast"); el.textContent = t("copied") + text; el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1300);
}

function cmdBox(text, enabled = true, hint = "") {
  return `<div class="cmd ${enabled ? "" : "off"}"><code>${esc(text)}</code>${
    enabled ? `<button onclick="copy('${esc(text)}')">${t("copy")}</button>` : `<span class="muted">${esc(hint)}</span>`}</div>`;
}

// Forager's map: row 0 winter; rows 1-5: graveyard in columns 0-1, desert in 5-6; winter in the middle three of row 1,
// grass the 3x3 centre (rows 2-4), fire the middle three of row 5; row 6 fire. 10 + 10 + 9 + 10 + 10 = 49.
function biomeAt(r, c) {
  if (r === 0) return "Inverno";
  if (r === 6) return "Fogo";
  if (c <= 1) return "Cemitério";
  if (c >= 5) return "Deserto";
  if (r === 1) return "Inverno";
  if (r === 5) return "Fogo";
  return "Grama";
}

function worldMap() {
  const queues = {};
  for (const b of BIOMES) queues[b] = D.lands.filter((l) => l.biome === b);
  const startIdx = queues.Grama.findIndex((l) => /starting/i.test(l.key || l.land));
  const start = startIdx >= 0 ? queues.Grama.splice(startIdx, 1)[0] : null;  // the starting island in the middle
  const cells = [];
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
    const b = biomeAt(r, c);
    cells.push({ biome: b, land: r === 3 && c === 3 && start ? start : queues[b].shift() });
  }
  return cells;
}

const puzzleOf = (l) => (l.puzzle ? D.puzzles.find((x) => x.n === l.puzzle) : null);
const dungeonOf = (l) => (l.dungeon ? D.dungeons.find((x) => x.n === l.dungeon) : null);

// My notes per island (title, description, "synced" check), kept in this browser's localStorage.
const NOTES_KEY = "forager-island-notes";
let NOTES = {};
try { NOTES = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}") || {}; } catch (e) { NOTES = {}; }
const noteOf = (l) => NOTES[l.key || l.land] || {};
function setNote(l, patch) {
  const n = { ...noteOf(l), ...patch };
  const id = l.key || l.land;
  if (!n.title && !n.text && !n.ok) delete NOTES[id]; else NOTES[id] = n;
  try { localStorage.setItem(NOTES_KEY, JSON.stringify(NOTES)); } catch (e) {}
  const i = CELLS.findIndex((c) => c.land === l);
  const el = $("#map").children[i];
  if (el) el.outerHTML = tile(CELLS[i], i);
}
function toggleCheck(ev, i) { ev.stopPropagation(); const l = CELLS[i].land; setNote(l, { ok: !noteOf(l).ok }); const c = $("#nok"); if (c && c.dataset.i == i) c.checked = !!noteOf(l).ok; }

function tile(cell, i) {
  const l = cell.land;
  if (!l) return `<div class="tile t-${cell.biome}"></div>`;
  const p = puzzleOf(l), n = noteOf(l);
  return `<div class="tile t-${l.biome} ${n.ok ? "done" : ""}" style="${l.image ? `background-image:url('${esc(l.image)}')` : ""}" onclick="openLand(${i})" title="${esc(n.title || l.land)} — ${esc(n.text || l.desc)}">
    <button type="button" class="ck ${n.ok ? "on" : ""}" onclick="toggleCheck(event, ${i})" title="${n.ok ? t("checkOn") : t("checkOff")}">✓</button>
    ${p ? `<span class="pn"><span class="st" style="background:${STATUS_COLOR[p.status]}"></span>#${p.n}</span>` : l.dungeon ? `<span class="pn">D${l.dungeon}</span>` : ""}
    <div class="lbl"><b class="${n.title ? "mine" : ""}">${esc(n.title || l.land)}</b><br><small>${esc(l.kind)}</small></div></div>`;
}
// The "my notes" block inside an island's window.
function notesRow(i) {
  const n = noteOf(CELLS[i].land);
  return `<div class="row"><b>${t("myNotes")}</b><div class="notes">
    <input type="text" id="ntitle" placeholder="${esc(t("noteTitle"))}" value="${esc(n.title || "")}" oninput="saveNotes(${i})">
    <textarea id="ntext" placeholder="${esc(t("noteText"))}" oninput="saveNotes(${i})">${esc(n.text || "")}</textarea>
    <label><input type="checkbox" id="nok" data-i="${i}" ${n.ok ? "checked" : ""} onchange="saveNotes(${i})"> ${t("noteOk")}</label>
    <span class="saved">${t("noteSaved")}</span></div></div>`;
}
function saveNotes(i) { setNote(CELLS[i].land, { title: $("#ntitle").value.trim(), text: $("#ntext").value, ok: $("#nok").checked }); }

const CELLS = worldMap();
$("#map").innerHTML = CELLS.map(tile).join("");

function show(html, image) {
  $("#sheet").innerHTML = `${image ? `<div class="big" style="background-image:url('${esc(image)}')"></div>` : ""}<div class="content">${html}</div>`;
  $("#modal").classList.add("on");
}

const closeBtn = `<button class="close" onclick="closeModal()">×</button>`;

function openLand(i) {
  const l = CELLS[i].land;
  const p = puzzleOf(l), d = dungeonOf(l);
  if (p) return openPuzzle(p, l, i);
  if (d) {
    return show(`<div>${closeBtn}<h3>D${d.n} — ${esc(d.name)}</h3>
      <div class="meta"><span class="tag b-${d.biome}">${esc(L(d.biome))}</span><span class="tag s-mod">${t("legendMod")}</span></div></div>
      <div class="row"><b>${t("inCoop")}</b><div>${esc(d.note)}</div></div>
      <div class="row"><b>${t("cmdsRow")}</b><div>${cmdBox("/chestremove")}<div class="muted" style="margin-top:4px">${t("chestRemoveYou")}</div></div></div>
      <div class="row"><b>${t("wiki")}</b><div><a href="https://forager.fandom.com/wiki/Dungeons" target="_blank">forager.fandom.com/wiki/Dungeons</a></div></div>${notesRow(i)}`, d.image || l.image);
  }
  show(`<div>${closeBtn}<h3>${esc(l.land)}</h3>
      <div class="meta"><span class="tag b-${l.biome}">${esc(L(l.biome))}</span><span class="tag" style="color:var(--muted)">${esc(l.kind)}</span></div></div>
      <div class="row"><b>${t("whatsThere")}</b><div>${esc(l.desc)}</div></div>
      <div class="row"><b>${t("wiki")}</b><div><a href="https://forager.fandom.com/wiki/${WIKI_BIOME[l.biome]}" target="_blank">${t("biomeWiki")}</a></div></div>${notesRow(i)}`, l.image);
}

function openPuzzle(p, l, i) {
  show(`<div>${closeBtn}<h3>#${p.n} — ${esc(p.name)}</h3>
      <div class="meta"><span class="tag b-${p.biome}">${esc(L(p.biome))}</span><span class="tag s-${p.status}">${STATUS[p.status]}</span>${l && l.land !== p.name ? `<span class="tag" style="color:var(--muted)">${t("island")}${esc(l.land)}</span>` : ""}</div></div>
      <div class="row"><b>${t("howSolve")}</b><div>${p.solution}</div></div>
      <div class="row"><b>${t("reward")}</b><div>${esc(p.reward)}</div></div>
      ${p.obj ? `<div class="row"><b>${t("gameObject")}</b><div><code>${esc(p.obj)}</code></div></div>` : ""}
      <div class="row"><b>${t("inCoop")}</b><div>${esc(p.note)}</div></div>
      <div class="row"><b>${t("cmdsRow")}</b><div style="display:flex;flex-direction:column;gap:6px">
        ${cmdBox("/puzzlereset " + p.n, p.reset, t("resetUnsupported"))}
        ${cmdBox("/chestremove")}
        <span class="muted">${t("chestRemoveBoth")}</span></div></div>
      <div class="row"><b>${t("wiki")}</b><div><a href="https://forager.fandom.com/wiki/Puzzles" target="_blank">forager.fandom.com/wiki/Puzzles</a></div></div>${i != null ? notesRow(i) : ""}`, p.image || (l && l.image));
}

function openCommands() {
  show(`<div>${closeBtn}<h3>${t("chatCommands")}</h3></div>
      <p class="muted" style="margin:0">${t("chatHelp")}</p>
      ${D.commands.map((c) => `<div>${cmdBox(c.cmd)}<div class="muted" style="margin-top:4px">${esc(c.desc)}</div></div>`).join("")}
      <div class="row"><b>${t("supported")}</b><div>${D.puzzles.filter((p) => p.reset).map((p) => `#${p.n} ${esc(p.name)}`).join(" · ")}</div></div>`, null);
}

// Items: the game's own icon > name > id, 0 to 318 one under the other; a click copies "/give <id>".
const CATS = ["Materiais", "Comida", "Picaretas", "Espadas", "Arcos", "Pás", "Varas", "Equipamentos", "Selos", "Pergaminhos",
  "Poções", "Bombas e munição", "Sementes", "Construção", "Pigmentos", "Engarrafados", "Relíquias", "Utilitários"];
const GROUPS = ["Inimigos", "Chefes", "Animais e criaturas", "Recursos", "Plantas", "Estruturas", "Especiais e puzzles", "NPCs",
  "Familiares", "Efeitos e mundo", "Interface", "Sistema", "Classe base"];
const SAFETY = { ok: t("safeOk"), care: t("safeCare"), no: t("safeNo") };
let itemCat = "", drawer = "give";
function setDrawer(which) {
  drawer = which; itemCat = "";
  $("#tabGive").classList.toggle("on", which === "give"); $("#tabSpawn").classList.toggle("on", which === "spawn");
  $("#isearch").placeholder = which === "give" ? t("searchGive") : t("searchSpawn");
  $("#dtitle").firstChild.textContent = which === "give" ? t("titleGive") : t("titleSpawn");
  renderCats(); renderItems();
}
function renderCats() {
  const list = drawer === "give" ? D.items : D.spawn, keyOf = (x) => (drawer === "give" ? x.cat : x.group);
  $("#cats").innerHTML = ["", ...(drawer === "give" ? CATS : GROUPS)].map((c) => {
    const n = c ? list.filter((x) => keyOf(x) === c).length : list.length;
    return `<button class="${c === itemCat ? "on" : ""}" onclick="itemCat='${c}'; renderCats(); renderItems()">${c ? esc(L(c)) : t("all")} ${n}</button>`;
  }).join("");
}
function renderSpawn() {
  const q = $("#isearch").value.trim().toLowerCase();
  const list = D.spawn.filter((o) => (!itemCat || o.group === itemCat) &&
    (!q || [o.name, o.what, o.does, String(o.id)].some((f) => f.toLowerCase().includes(q))));
  $("#icount").textContent = t("countOf", list.length, D.spawn.length);
  $("#ilist").innerHTML = list.map((o) => `<div class="item obj" onclick="copy('/spawn ${o.name}')" title="${esc(L(o.group))}">
      <span class="ic">${o.icon ? `<img src="${esc(o.icon)}" alt="" loading="lazy" onload="if(this.naturalWidth<=18&&this.naturalHeight<=18)this.style.zoom=2">` : ""}</span>
      <span class="nm"><b>${esc(o.what)}</b><br><code>${esc(o.name)}</code><span class="ds">${esc(o.does)}</span></span>
      <span class="safe ${o.safety}">${SAFETY[o.safety]}</span></div>`).join("");
}
function renderItems() {
  if (drawer === "spawn") return renderSpawn();
  const q = $("#isearch").value.trim().toLowerCase();
  const list = D.items.filter((it) => (!itemCat || it.cat === itemCat) &&
    (!q || it.name.toLowerCase().includes(q) || String(it.id).startsWith(q))).sort((a, b) => a.id - b.id);
  $("#icount").textContent = t("countOf", list.length, D.items.length);
  $("#ilist").innerHTML = list.map((it) => `<div class="item" onclick="copy('/give ${it.id}')" title="${esc(it.desc)}">
      <span class="ic"><img src="${esc(it.icon)}" alt="" loading="lazy"></span>
      <span class="nm">${esc(it.name)}<small>${esc(L(it.cat))}</small></span><span class="id">${it.id}</span></div>`).join("");
}
$("#isearch").oninput = renderItems;
renderCats();
renderItems();

// Skill tree view: the 8x8 grid of objSkillGridControl, icons and branch borders from the game.
const BRANCH_COLOR = { "Indústria": "#e8603d", "Economia": "#f2c94c", "Coleta": "#6cc24a", "Magia": "#4a9ff5" };
function renderSkills() {
  const cells = [...D.skills].sort((a, b) => a.y - b.y || a.x - b.x);
  $("#skilltree").innerHTML = cells.map((k) => `<div class="skill" style="background-image:url('${esc(k.border)}')" onclick="openSkill(${k.id})" title="#${k.id} ${esc(k.name)} — ${esc(k.desc)}">
      <img src="${esc(k.icon)}" alt=""><span class="sid">${k.id}</span></div>`).join("");
}
function openSkill(id) {
  const k = D.skills.find((x) => x.id === id);
  show(`<div>${closeBtn}<h3>#${k.id} — ${esc(k.name)}</h3>
      <div class="meta"><span class="tag" style="color:${BRANCH_COLOR[k.branch]}">${esc(L(k.branch))}</span><span class="tag" style="color:var(--muted)">${t("gridPos", k.x + 1, k.y + 1)}</span></div></div>
      <div style="display:flex;gap:16px;align-items:center"><div class="skill" style="width:72px;height:72px;flex:0 0 72px;background-image:url('${esc(k.border)}');cursor:default"><img src="${esc(k.icon)}" alt=""></div>
      <div style="white-space:pre-line">${esc(k.desc)}</div></div>
      <div class="row"><b>${t("inCoop")}</b><div>${esc(k.coop)}</div></div>`, null);
}
function setView(v) {
  $("#map").style.display = v === "islands" ? "" : "none";
  $("#skilltree").style.display = v === "skills" ? "" : "none";
  $("#feats").style.display = v === "feats" ? "" : "none";
  $("#vIslands").classList.toggle("on", v === "islands"); $("#vSkills").classList.toggle("on", v === "skills");
  $("#vFeats").classList.toggle("on", v === "feats");
  $("#craft").style.display = v === "craft" ? "" : "none";
  $("#vCraft").classList.toggle("on", v === "craft");
  for (const k of ["gear", "skins"]) { $("#" + k).style.display = v === k ? "" : "none"; $("#v" + k[0].toUpperCase() + k.slice(1)).classList.toggle("on", v === k); }
}

// Feats: all 103, as the game's feats screen shows them (earned look by default; "bloqueadas" shows the locked look).
let featsLocked = false, featQuery = "";
function renderFeats() {
  const list = D.feats.filter((f) => !featQuery || f.name.toLowerCase().includes(featQuery) || f.desc.toLowerCase().includes(featQuery) || String(f.id) === featQuery);
  $("#feats").innerHTML = `<div class="fhead"><h2>${t("feats")}</h2>
      <div class="fbar"><i style="width:${(list.length / D.feats.length) * 100}%"></i><span>${list.length} / ${D.feats.length}</span></div>
      <div class="ftools"><input id="fsearch" placeholder="${esc(t("searchFeat"))}" value="${esc(featQuery)}">
        <button onclick="featsLocked=!featsLocked; renderFeats()">${featsLocked ? t("seeEarned") : t("seeLocked")}</button></div></div>
    <div class="fgrid">${list.map((f) => `<div class="feat" title="#${f.id}"><img src="${esc(featsLocked ? f.locked : f.icon)}" alt="">
      <b>${esc(f.name)}</b><small>${esc(f.desc)}</small><span class="fid">#${f.id}</span></div>`).join("")}</div>`;
  const input = $("#fsearch");
  if (input && input.addEventListener) input.addEventListener("input", (e) => { featQuery = e.target.value.trim().toLowerCase(); renderFeats(); const i = document.getElementById("fsearch"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
}
renderFeats();

// Crafting stations and what they make: costs, unlocks (skills, from the game's skill texts) and upgrade chains.
const itemName = (id) => D.itemNames[id] || "#" + id;
const costHtml = (cost) => `<div class="costs">${cost.map((c) => `<span class="cost" title="${esc(itemName(c.id))}"><img src="items/${c.id}.png" alt="">×${c.n}</span>`).join("") || '<span class="muted">—</span>'}</div>`;
function unlockHtml(u) {
  if (u.type === "default") return `<span class="ulock">${t("unlockedStart")}</span>`;
  if (u.type === "skill") return `<span class="ulock"><img src="skills/${u.id}.png" alt="">${t("skill")} #${u.id} <b>${esc(u.name)}</b></span>`;
  return `<span class="ulock">🔒 ${esc(u.name)}</span>`;
}
function renderCraft() {
  $("#craft").innerHTML = `<div class="fhead"><h2>${t("crafting")}</h2><span class="muted" style="color:#c9c2dd">${t("craftHelp")}</span></div>
    <div class="sgrid">${D.stations.map((st) => `<div class="station" onclick="openStation(${st.id})">
      <div class="simg"><img src="${esc(st.image)}" alt=""></div><b>${esc(st.name)}</b><small>${t("recipes", st.recipes.length)}</small></div>`).join("")}</div>`;
}
function openStation(id) {
  const st = D.stations.find((x) => x.id === id);
  show(`<div style="margin:-16px -20px -20px">${closeBtn.replace('class="close"', 'class="close" style="position:absolute;right:14px;top:8px;z-index:2"')}<div id="panelHost" style="padding:4px"></div></div>`, null);
  $("#sheet").classList.add("inside");
  window.CraftPanel.open(st, D, document.getElementById("panelHost"));
}
renderCraft();

// Equipment screen, drawn like the game's (its sprGearBox panels and sprGearBoxDisabled slots).
// Click a slot to see what the item does and how to get it.
const GEAR_PANELS = [
  { key: "tools", title: t("gTools"), box: 0, cols: 9 },
  { key: "accessories", title: t("gAcc"), box: 1, cols: 2 },
  { key: "seals", title: t("gSeals"), box: 3, cols: 3 },
  { key: "artifacts", title: t("gArt"), box: 2, cols: 5 },
  { key: "sigils", title: t("gSigils"), box: 4, cols: 4 },
];
let gearSel = { key: "tools", i: 0 };
const gft = (t, o) => (window.CraftPanel && window.CraftPanel.ft ? window.CraftPanel.ft(t, o) : esc(t));
function gearSlotIcon(key, x) { return key === "accessories" ? x.tiers[x.tiers.length - 1].icon : x.icon; }
function gearPanel(p) {
  const list = D.gear[p.key];
  return `<div class="eqp"><div class="eqt">${gft(p.title)}</div>
    <div class="eqbox b${p.box}" style="grid-template-columns:repeat(${p.cols},48px)">${list.map((x, i) =>
      `<button type="button" class="eqs b${p.box} ${gearSel.key === p.key && gearSel.i === i ? "sel" : ""}" data-k="${p.key}" data-i="${i}" title="${esc(x.label || x.name)}">
        <img src="${esc(gearSlotIcon(p.key, x))}" alt=""></button>`).join("")}</div></div>`;
}
function gearDetail() {
  const x = D.gear[gearSel.key][gearSel.i];
  const panel = GEAR_PANELS.find((p) => p.key === gearSel.key);
  const tiers = x.tiers ? `<div class="tiers">${x.tiers.map((t, k) => `<div class="tier"><span class="ti"><img src="${esc(t.icon)}" alt=""></span>
      <div class="tt"><b>${k + 1}. ${esc(t.name)}</b> <span class="fid">/give ${t.id}</span><small>${esc(t.desc)}</small>${t.cost.length ? costHtml(t.cost) : ""}</div></div>`).join("")}</div>` : "";
  const how = gearSel.key === "accessories"
    ? esc(t("accHow", x.station, x.unlock.type === "skill" ? `${t("skill")} ${x.unlock.name}` : x.unlock.type === "default" ? t("unlockedStart") : x.unlock.name))
    : esc(x.how);
  return `<div class="eqdet b${panel.box}">
    <div class="eqdh"><span class="eqs b${panel.box} big"><img src="${esc(gearSlotIcon(gearSel.key, x))}" alt=""></span>
      <div class="gt"><div>${gft(x.label || x.name)}</div>${x.tag ? `<span class="gtag t-${esc(x.tag)}">${esc(L(x.tag))}</span>` : ""}
      ${x.desc ? `<small>${esc(x.desc)}</small>` : ""}<span class="how"><b class="howl">${t("howGet")}</b>${how}</span>${x.tiers ? "" : `<span class="fid">/give ${x.id}</span>`}</div></div>
    ${tiers}</div>`;
}
async function renderGear() {
  if (window.CraftPanel && window.CraftPanel.ready) await window.CraftPanel.ready();
  const P = (k) => gearPanel(GEAR_PANELS.find((p) => p.key === k));
  $("#gear").innerHTML = `<div class="eq">
    <div class="eqrow">${P("tools")}</div>
    <div class="eqrow">${P("accessories")}${P("seals")}${P("artifacts")}</div>
    <div class="eqrow">${P("sigils")}</div>
    <div class="eqrow">${gearDetail()}</div>
    <p class="eqnote">${t("gearNote")}</p></div>`;
  document.querySelectorAll("#gear button.eqs").forEach((el) => el.addEventListener("click", () => { gearSel = { key: el.dataset.k, i: +el.dataset.i }; renderGear(); }));
}
renderGear();

// Skins: 123 cosmetics in 4 slots, chosen in the druid's treehouse; most are rewards for feats.
const SLOTS = ["Cabeça", "Corpo", "Mochila", "Asas"].map(L);
let skinSlot = -1, skinQuery = "";
function renderSkins() {
  const q = skinQuery;
  const list = D.skins.filter((s) => (skinSlot < 0 || s.slot === skinSlot) && (!q || s.name.toLowerCase().includes(q) || s.text.toLowerCase().includes(q)));
  const count = (i) => D.skins.filter((s) => s.slot === i).length;
  $("#skins").innerHTML = `<div class="fhead"><h2>${t("skins")}</h2>
      <span class="muted" style="color:#c9c2dd">${t("skinsHelp", D.skins.length)}</span>
      <div class="ftools"><button onclick="skinSlot=-1; renderSkins()" style="${skinSlot < 0 ? "background:#2a3560" : ""}">${t("allF")} (${D.skins.length})</button>
        ${SLOTS.map((n, i) => `<button onclick="skinSlot=${i}; renderSkins()" style="${skinSlot === i ? "background:#2a3560" : ""}">${n} (${count(i)})</button>`).join("")}
        <input id="ssearch" placeholder="${esc(t("searchSkin"))}" value="${esc(skinQuery)}"></div></div>
    <div class="fgrid skgrid">${list.map((s) => `<div class="skin"><div class="si"><img src="${esc(s.icon)}" alt=""></div>
      <b>${esc(s.name)}</b><span class="gtag t-${esc(s.how)}">${esc(SLOTS[s.slot])} · ${esc(L(s.how))}</span>
      ${s.feat != null ? `<img src="feats/f${s.feat}.png" alt="" style="width:32px;height:32px;image-rendering:pixelated">` : s.item != null ? `<img src="items/${s.item}.png" alt="" style="zoom:2;image-rendering:pixelated">` : ""}
      <small>${esc(s.text)}</small></div>`).join("")}</div>`;
  const input = $("#ssearch");
  if (input && input.addEventListener) input.addEventListener("input", (e) => { skinQuery = e.target.value.trim().toLowerCase(); renderSkins(); const i = document.getElementById("ssearch"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
}
renderSkins();
renderSkills();

function closeModal() { $("#modal").classList.remove("on"); $("#sheet").classList.remove("inside"); }
$("#modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
